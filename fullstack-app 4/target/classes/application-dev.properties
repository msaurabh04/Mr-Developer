# Dev profile: runs the whole app against an in-memory H2 database.
# Perfect for trying the project immediately without installing MySQL/PostgreSQL.
# Activate with: spring.profiles.active=dev  (already set as default in application.properties)
# Data is wiped every time the app restarts.

spring.datasource.url=jdbc:h2:mem:fullstack_app_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console, available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
