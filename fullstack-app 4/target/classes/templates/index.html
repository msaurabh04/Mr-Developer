<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MrShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container hero">
    <div class="hero-badge">Welcome to</div>
    <h1 class="hero-title">MrShop</h1>
    <p class="subtitle">Browse the full catalog freely. Log in to unlock your personalized shopping experience.</p>
    <div class="hero-actions">
        <a th:href="@{/login}" class="btn btn-primary btn-glow">Login</a>
        <a th:href="@{/register}" class="btn btn-secondary btn-3d">Create an account</a>
    </div>
</div>

<div class="container">
    <div class="section-heading">
        <h2>Explore Our Products</h2>
        <p class="subtitle">No login required to look around</p>
    </div>

    <div class="product-grid">
        <div class="product-card-3d" th:each="product,iter : ${products}"
             th:style="'animation-delay: ' + ${iter.index * 80} + 'ms'">
            <div class="product-card-inner">
                <div class="product-card-shine"></div>
                <span class="category-tag" th:if="${product.category}" th:text="${product.category}"></span>
                <h3 th:text="${product.name}"></h3>
                <p class="product-desc" th:text="${product.description}"></p>
                <div class="product-footer">
                    <span class="product-price" th:text="${'$' + product.price}"></span>
                    <a th:href="@{/login}" class="btn btn-small btn-primary">Login to buy</a>
                </div>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(products)}">
            No products available yet.
        </div>
    </div>
</div>
</body>
</html>
