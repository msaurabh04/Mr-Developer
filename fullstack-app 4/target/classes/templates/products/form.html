<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container auth-container">
    <div class="auth-card">
        <h2 th:text="${formTitle}">Product Form</h2>

        <form th:action="${product.id != null} ? @{/products/edit/{id}(id=${product.id})} : @{/products}"
              th:object="${product}" method="post" class="form">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" step="0.01" id="price" th:field="*{price}">
                <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" th:field="*{quantity}">
                <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" th:field="*{category}">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Save</button>
            <a th:href="@{/products}" class="btn btn-secondary btn-block">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
