spring.application.name=fullstack-app

# ===============================
# Active profile
# ===============================
# This app now runs directly against PostgreSQL by default (no "dev"/H2 profile active),
# so data written through the app is persisted for real and visible in pgAdmin.
# Leave this line blank/commented to use the PostgreSQL config below.
# spring.profiles.active=dev

server.port=8080

# ===============================
# PostgreSQL configuration (default / active)
# ===============================
# Create a database named "fullstack_app_db" in pgAdmin first (right-click
# "Databases" -> Create -> Database...), then these settings will connect to it.
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# To use MySQL instead, comment out the PostgreSQL block above and uncomment this:
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/fullstack_app_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
